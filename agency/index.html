<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>服饰运动·小店服务商榜单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #2c3e50;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 24px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .header h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .header .meta {
    font-size: 13px;
    opacity: 0.9;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }
  /* 类目tab */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: white;
    padding: 8px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    transition: all 0.2s;
    flex: 1;
    text-align: center;
  }
  .tab:hover { background: #f0f3ff; color: #667eea; }
  .tab.active { background: #667eea; color: white; }
  /* summary条 */
  .summary {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .summary-card {
    flex: 1;
    background: white;
    padding: 14px 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .summary-card .label {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .summary-card .value {
    font-size: 20px;
    font-weight: 600;
    color: #2c3e50;
  }
  /* 排序切换 */
  .sort-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-btn {
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
    background: white;
    border: 1px solid #e0e4ea;
    color: #666;
    transition: all 0.2s;
  }
  .sort-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }
  /* 表格 */
  .table-wrapper {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 12px 16px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid #f0f3f7;
  }
  th {
    background: #fafbfd;
    font-weight: 600;
    color: #5a6577;
    font-size: 12px;
    position: sticky;
    top: 0;
  }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: #f5f7ff; }
  .rank {
    display: inline-block;
    width: 28px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    border-radius: 50%;
    font-weight: 600;
    font-size: 12px;
    color: white;
    background: #b0b7c3;
  }
  .rank.r1 { background: linear-gradient(135deg, #FFD700, #FFA500); }
  .rank.r2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); }
  .rank.r3 { background: linear-gradient(135deg, #CD7F32, #B8732A); }
  .agency-name {
    font-weight: 600;
    color: #667eea;
  }
  .entity {
    font-size: 12px;
    color: #999;
    margin-top: 3px;
  }
  .num {
    font-weight: 600;
    color: #2c3e50;
  }
  .gmv-bar {
    display: inline-block;
    height: 6px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 8px;
  }
  /* 详情弹层 */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    width: 90%;
    max-width: 1100px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 20px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .modal-header h2 {
    font-size: 18px;
    margin-bottom: 6px;
  }
  .modal-header .modal-meta {
    font-size: 13px;
    opacity: 0.9;
  }
  .modal-close {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  .modal-close:hover { background: rgba(255,255,255,0.3); }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  .modal-summary {
    display: flex;
    gap: 24px;
    padding: 16px 28px;
    background: #f5f7ff;
    border-bottom: 1px solid #e8ebf3;
  }
  .modal-summary div {
    font-size: 13px;
    color: #5a6577;
  }
  .modal-summary div b {
    color: #667eea;
    font-size: 16px;
    font-weight: 600;
    margin-right: 4px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-adq { background: #fef0e7; color: #e8722f; }
  .badge-qyt { background: #e7f1ff; color: #4a90e2; }
  .empty {
    padding: 40px;
    text-align: center;
    color: #999;
  }
  /* 搜索 */
  .search-box {
    margin-left: auto;
  }
  .search-box input {
    padding: 8px 14px;
    border: 1px solid #e0e4ea;
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
    outline: none;
  }
  .search-box input:focus { border-color: #667eea; }
  .toolbar {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .footer-tip {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 24px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 服饰运动 · 小店服务商榜单</h1>
  <div class="meta">数据日期 2026-05-22 · 仅统计已注册全域通的小店挂靠 · 点击服务商查看其名下绑定的小店明细</div>
</div>

<div class="container">

  <!-- 类目tab -->
  <div class="tabs" id="categoryTabs"></div>

  <!-- summary -->
  <div class="summary" id="summary"></div>

  <!-- 排序+搜索 -->
  <div class="toolbar">
    <div class="sort-tabs">
      <button class="sort-btn active" data-sort="rank_shop">📦 按绑定店铺数</button>
      <button class="sort-btn" data-sort="rank_gmv">💰 按 GMV 排序</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 搜索服务商名称">
    </div>
  </div>

  <!-- 服务商列表 -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:60px">排名</th>
          <th>服务商</th>
          <th style="width:120px">绑定店铺数</th>
          <th style="width:200px">GMV（万元）</th>
        </tr>
      </thead>
      <tbody id="agencyList"></tbody>
    </table>
  </div>

  <div class="footer-tip">数据来源：表1服饰运动小店动销+表2注册全域通+表3挂靠关系 | 橘橘有500w 出品 🦞</div>
</div>

<!-- 详情弹层 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle"></h2>
        <div class="modal-meta" id="modalEntity"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-body">
      <table>
        <thead>
          <tr>
            <th style="width:50px">#</th>
            <th>小店名称</th>
            <th>客户主体</th>
            <th style="width:120px">类目</th>
            <th style="width:100px">GMV(万)</th>
            <th style="width:140px">投放状态</th>
          </tr>
        </thead>
        <tbody id="shopList"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let DASHBOARD_DATA = null;
let currentCategory = '整体';
let currentSort = 'rank_shop';

// 加载数据
fetch('agency_data.json').then(r => r.json()).then(data => {
  DASHBOARD_DATA = data;
  initTabs();
  render();
}).catch(e => {
  document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#e74c3c">数据加载失败：'+e.message+'<br>请确保 agency_data.json 与本HTML在同目录下，或通过本地服务器访问。</div>';
});

function initTabs() {
  const tabs = document.getElementById('categoryTabs');
  const cats = Object.keys(DASHBOARD_DATA.categories);
  tabs.innerHTML = cats.map(c => `<div class="tab ${c===currentCategory?'active':''}" data-cat="${c}">${c}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      currentCategory = t.dataset.cat;
      tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===t));
      render();
    };
  });
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.onclick = () => {
      currentSort = b.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach(x => x.classList.toggle('active', x===b));
      render();
    };
  });
  document.getElementById('searchInput').addEventListener('input', render);
}

function render() {
  const cat = DASHBOARD_DATA.categories[currentCategory];
  const summary = cat.summary;
  
  // summary
  document.getElementById('summary').innerHTML = `
    <div class="summary-card"><div class="label">服务商总数</div><div class="value">${summary.agency_count.toLocaleString()}</div></div>
    <div class="summary-card"><div class="label">绑定小店总数（已注册全域通）</div><div class="value">${summary.shop_count.toLocaleString()}</div></div>
    <div class="summary-card"><div class="label">GMV合计（万元）</div><div class="value">${summary.gmv_total.toLocaleString()}</div></div>
    <div class="summary-card"><div class="label">展示TOP100</div><div class="value">${cat.agencies.length}</div></div>
  `;
  
  // 列表
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = cat.agencies.filter(a => {
    if (currentSort === 'rank_shop') return a.rank_shop <= 100;
    return a.rank_gmv <= 100;
  });
  if (search) {
    list = list.filter(a => a.agency.toLowerCase().includes(search) || a.entity.toLowerCase().includes(search));
  }
  list.sort((a,b) => a[currentSort] - b[currentSort]);
  
  const maxGmv = Math.max(...list.map(a => a.gmv), 1);
  const maxShops = Math.max(...list.map(a => a.shops), 1);
  
  const tbody = document.getElementById('agencyList');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">没有匹配的服务商</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(a => {
    const r = a[currentSort];
    const rankClass = r===1?'r1':r===2?'r2':r===3?'r3':'';
    const barWidth = currentSort === 'rank_shop' ? (a.shops/maxShops*120) : (a.gmv/maxGmv*120);
    return `
      <tr onclick="openModal('${a.agency.replace(/'/g,"\\'")}')">
        <td><span class="rank ${rankClass}">${r}</span></td>
        <td>
          <div class="agency-name">${a.agency}</div>
          <div class="entity">${a.entity}</div>
        </td>
        <td><span class="num">${a.shops}</span> 家</td>
        <td>
          <span class="num">${a.gmv.toLocaleString()}</span>
          <span class="gmv-bar" style="width:${barWidth}px"></span>
        </td>
      </tr>
    `;
  }).join('');
}

function openModal(agencyName) {
  const cat = DASHBOARD_DATA.categories[currentCategory];
  const ag = cat.agencies.find(a => a.agency === agencyName);
  const shops = cat.shop_details[agencyName] || [];
  
  document.getElementById('modalTitle').textContent = `🏢 ${agencyName}`;
  document.getElementById('modalEntity').textContent = ag.entity;
  
  const adqCnt = shops.filter(s => s.adq).length;
  const qytCnt = shops.filter(s => s.qyt).length;
  
  document.getElementById('modalSummary').innerHTML = `
    <div><b>${ag.shops}</b>家 绑定店铺（${currentCategory}）</div>
    <div><b>${ag.gmv.toLocaleString()}</b>万 GMV合计</div>
    <div><b>${adqCnt}</b>家 ADQ在投</div>
    <div><b>${qytCnt}</b>家 全域通在投</div>
    <div style="margin-left:auto;color:#999;font-size:12px">展示TOP${shops.length}小店，按GMV倒序</div>
  `;
  
  const tbody = document.getElementById('shopList');
  if (shops.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">该服务商在此类目下暂无小店明细</td></tr>';
  } else {
    tbody.innerHTML = shops.map((s, i) => `
      <tr>
        <td>${i+1}</td>
        <td><b>${s.shop_name}</b><div class="entity">${s.shop_id}</div></td>
        <td>${s.entity}</td>
        <td>${s.cat2}<div class="entity">${s.cat1}</div></td>
        <td><span class="num">${s.gmv.toLocaleString()}</span></td>
        <td>
          ${s.adq?'<span class="badge badge-adq">ADQ在投</span>':''}
          ${s.qyt?'<span class="badge badge-qyt">QYT在投</span>':''}
          ${(!s.adq && !s.qyt)?'<span style="color:#bbb;font-size:12px">未在投</span>':''}
        </td>
      </tr>
    `).join('');
  }
  
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
