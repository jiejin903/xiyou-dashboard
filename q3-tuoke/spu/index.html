<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3男装·SPU爆品罗盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }

  /* ===== 顶部 ===== */
  header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 24px 20px 18px; }
  .header-inner { max-width: 1440px; margin: 0 auto; }
  header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .meta { font-size: 12px; opacity: 0.9; }
  .meta span { margin-right: 16px; }

  /* ===== KPI 条 ===== */
  .kpi-bar { max-width: 1440px; margin: -12px auto 0; padding: 0 20px; }
  .kpi-grid { background: #fff; border-radius: 12px; padding: 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .kpi { text-align: center; padding: 8px 4px; border-right: 1px solid #f0f0f0; }
  .kpi:last-child { border-right: none; }
  .kpi-val { font-size: 22px; font-weight: 700; color: #667eea; margin-bottom: 4px; }
  .kpi-label { font-size: 11px; color: #7f8c8d; }
  .kpi.highlight .kpi-val { color: #e67e22; }

  /* ===== 说明区 ===== */
  .note-bar { max-width: 1440px; margin: 16px auto 0; padding: 0 20px; }
  .note { background: #fff9e8; border-left: 3px solid #f39c12; padding: 10px 14px; font-size: 12px; color: #7a5c1a; border-radius: 6px; }
  .note strong { color: #d68910; }

  /* ===== SPU 网格 ===== */
  main { max-width: 1440px; margin: 20px auto; padding: 0 20px 40px; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 4px; height: 16px; background: #667eea; border-radius: 2px; }

  .spu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .spu-card { background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; border: 1px solid #eee; }
  .spu-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,0.15); border-color: #667eea; }
  .rank-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; z-index: 2; }
  .rank-badge.top3 { background: linear-gradient(135deg, #f39c12, #e67e22); }
  .new-tag { position: absolute; top: 8px; right: 8px; background: #e74c3c; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; z-index: 2; }
  .spu-img-wrap { width: 100%; aspect-ratio: 1/1; background: #fafafa; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .spu-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .spu-info { padding: 10px 12px; }
  .spu-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #2c3e50; }
  .spu-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: #7f8c8d; }
  .spu-gmv { font-size: 18px; font-weight: 700; color: #e67e22; margin-bottom: 6px; }
  .spu-gmv .unit { font-size: 11px; font-weight: 400; margin-left: 2px; color: #7f8c8d; }
  .spu-price { display: inline-block; background: #f0f4ff; color: #667eea; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; }
  .spu-stats { display: flex; gap: 8px; font-size: 11px; margin-bottom: 8px; }
  .spu-stat { flex: 1; text-align: center; background: #f8f9fa; padding: 5px 4px; border-radius: 4px; }
  .spu-stat b { display: block; font-size: 13px; color: #2c3e50; }
  .spu-stat.new b { color: #e74c3c; }
  .spu-stat .lbl { color: #95a5a6; font-size: 10px; }

  /* 版型分布小 bar */
  .style-dist { border-top: 1px dashed #eee; padding-top: 8px; }
  .style-dist-title { font-size: 10px; color: #95a5a6; margin-bottom: 5px; }
  .style-bar { display: flex; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; background: #f0f0f0; margin-bottom: 5px; }
  .style-seg { height: 100%; }
  .style-seg-0 { background: #667eea; }
  .style-seg-1 { background: #f39c12; }
  .style-seg-2 { background: #1abc9c; }
  .style-seg-3 { background: #e74c3c; }
  .style-seg-4 { background: #95a5a6; }
  .style-legend { font-size: 10px; color: #7f8c8d; display: flex; flex-wrap: wrap; gap: 6px; }
  .style-legend-item { display: inline-flex; align-items: center; gap: 3px; }
  .style-legend-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  /* ===== 抽屉（店铺明细）===== */
  .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s; }
  .drawer-mask.open { opacity: 1; visibility: visible; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 640px; max-width: 100%; background: #fff; z-index: 101; transform: translateX(100%); transition: transform 0.3s; display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .drawer-close { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; opacity: 0.9; }
  .drawer-title { flex: 1; }
  .drawer-title h2 { font-size: 16px; font-weight: 700; }
  .drawer-title .drawer-meta { font-size: 12px; opacity: 0.9; margin-top: 3px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

  .shop-list { display: flex; flex-direction: column; gap: 8px; }
  .shop-item { display: flex; gap: 12px; padding: 10px; border-radius: 8px; border: 1px solid #eee; background: #fff; transition: all 0.15s; }
  .shop-item.new-cust { background: linear-gradient(135deg, #fff5f0 0%, #ffede0 100%); border-color: #f39c12; }
  .shop-rank { flex-shrink: 0; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: #f0f4ff; color: #667eea; }
  .shop-item.new-cust .shop-rank { background: #e67e22; color: #fff; }
  .shop-img { flex-shrink: 0; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; background: #fafafa; }
  .shop-img img { width: 100%; height: 100%; object-fit: cover; }
  .shop-info { flex: 1; min-width: 0; }
  .shop-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .shop-tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
  .shop-tag.invested { background: #eef2f7; color: #7f8c8d; }
  .shop-tag.new { background: #e74c3c; color: #fff; }
  .shop-product { font-size: 11px; color: #7f8c8d; line-height: 1.4; margin-bottom: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .shop-stats { display: flex; gap: 10px; font-size: 11px; color: #95a5a6; }
  .shop-stats span b { color: #2c3e50; font-weight: 600; }
  .adq-info { margin-top: 3px; font-size: 10px; color: #999; }
  .adq-info b { color: #7f8c8d; }

  /* ===== 移动端 ===== */
  @media (max-width: 768px) {
    header { padding: 18px 14px 14px; }
    header h1 { font-size: 17px; }
    .meta { font-size: 11px; }
    .meta span { display: block; margin-bottom: 2px; margin-right: 0; }
    .kpi-bar { padding: 0 12px; }
    .kpi-grid { grid-template-columns: repeat(3, 1fr); padding: 12px 8px; gap: 6px; }
    .kpi:nth-child(4), .kpi:nth-child(5) { border-right: none; }
    .kpi:nth-child(3) { border-right: none; }
    .kpi-val { font-size: 18px; }
    .kpi-label { font-size: 10px; }
    .note-bar { padding: 0 12px; }
    main { padding: 0 12px 40px; }
    .spu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .spu-name { font-size: 14px; }
    .spu-gmv { font-size: 16px; }
    .drawer { width: 100%; height: 100vh; border-radius: 0; }
    .shop-img { width: 50px; height: 50px; }
    .shop-name { font-size: 12px; }
  }
  @media (max-width: 480px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi:nth-child(3), .kpi:nth-child(5) { border-right: none; }
    .spu-grid { grid-template-columns: 1fr; }
    .spu-img-wrap { aspect-ratio: 16/10; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>🔥 Q3男装·SPU爆品罗盘</h1>
    <div class="meta">
      <span>📅 数据周期：<b id="period">-</b></span>
      <span>📊 数据源：<b id="source">-</b></span>
      <span>🎯 SPU 聚合：细分类目 × 面料</span>
      <span>📐 版型作为详情属性展示</span>
    </div>
  </div>
</header>

<div class="kpi-bar">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-val" id="kpi-spu">-</div><div class="kpi-label">SPU 数量</div></div>
    <div class="kpi"><div class="kpi-val" id="kpi-product">-</div><div class="kpi-label">聚合商品链接</div></div>
    <div class="kpi"><div class="kpi-val" id="kpi-gmv">-</div><div class="kpi-label">合计GMV估算</div></div>
    <div class="kpi"><div class="kpi-val" id="kpi-shop">-</div><div class="kpi-label">涉及店铺</div></div>
    <div class="kpi highlight"><div class="kpi-val" id="kpi-new">-</div><div class="kpi-label">潜在新客店铺</div></div>
  </div>
</div>

<div class="note-bar">
  <div class="note">
    <strong>💡 SPU 视角看爆品：</strong>把 3000 个商品按"<strong>面料 × 细分类目</strong>"聚合（冰丝T恤/亚麻休闲裤等），版型（POLO/直筒/老爹...）作为详情属性以进度条形式展示。<strong>点卡片</strong>看该SPU下的 TOP20 店铺，🔥红色标签=ADQ潜在新客。
    <strong>单价</strong>由佣金反推（佣金÷佣金率），<strong>GMV</strong>按销售额档位中点估算，仅作数量级参考。
  </div>
</div>

<main>
  <div class="section-title">爆品 SPU 榜单 · 按合计GMV排序</div>
  <div class="spu-grid" id="spu-grid"></div>
</main>

<!-- 抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-close" id="drawer-close">✕</div>
    <div class="drawer-title">
      <h2 id="drawer-spu">-</h2>
      <div class="drawer-meta" id="drawer-meta">-</div>
    </div>
  </div>
  <div class="drawer-body">
    <div class="shop-list" id="shop-list"></div>
  </div>
</div>

<script>
  let DATA = null;

  function fmtWan(n) {
    if (n >= 100000000) return (n / 100000000).toFixed(2) + '亿';
    if (n >= 10000) return Math.round(n / 10000) + '万';
    return n;
  }

  function renderKPI() {
    document.getElementById('period').textContent = DATA.period;
    document.getElementById('source').textContent = DATA.source;
    document.getElementById('kpi-spu').textContent = DATA.spuCount;
    document.getElementById('kpi-product').textContent = DATA.actualProducts;
    document.getElementById('kpi-gmv').innerHTML = DATA.totalGmvYi + '<span style="font-size:12px;color:#7f8c8d;">亿</span>';
    document.getElementById('kpi-shop').textContent = DATA.totalShops;
    document.getElementById('kpi-new').textContent = DATA.uniqueNewShops;
  }

  function renderSPU() {
    const grid = document.getElementById('spu-grid');
    grid.innerHTML = DATA.spus.map(s => `
      <div class="spu-card" onclick="openDrawer(${s.rank - 1})">
        <div class="rank-badge${s.rank <= 3 ? ' top3' : ''}">#${s.rank}</div>
        ${s.newShopCount > 0 ? `<div class="new-tag">🔥 ${s.newShopCount}家新客</div>` : ''}
        <div class="spu-img-wrap">
          <img src="${s.topProductImg}" alt="${s.spu}" onerror="this.style.display='none'">
        </div>
        <div class="spu-info">
          <div class="spu-name">${s.spu}</div>
          <div class="spu-price">💰 单价 ${s.priceRange}</div>
          <div class="spu-gmv">${fmtWan(s.totalGmv)}<span class="unit">合计GMV</span></div>
          <div class="spu-stats">
            <div class="spu-stat"><b>${s.productCount}</b><span class="lbl">商品链接</span></div>
            <div class="spu-stat"><b>${s.shopCount}</b><span class="lbl">涉及店铺</span></div>
            <div class="spu-stat new"><b>${s.newShopCount}</b><span class="lbl">潜在新客</span></div>
          </div>
          ${renderStyleDist(s.styleDist)}
        </div>
      </div>
    `).join('');
  }

  function renderStyleDist(styleDist) {
    if (!styleDist || styleDist.length === 0) return '';
    const top = styleDist.slice(0, 4);
    const bars = top.map((d, i) => `<div class="style-seg style-seg-${i}" style="width:${d.pct}%" title="${d.label} ${d.pct}%"></div>`).join('');
    const legend = top.map((d, i) => `<span class="style-legend-item"><span class="style-legend-dot" style="background:${['#667eea','#f39c12','#1abc9c','#e74c3c'][i]}"></span>${d.label} ${d.pct}%</span>`).join('');
    return `
      <div class="style-dist">
        <div class="style-dist-title">📐 版型分布</div>
        <div class="style-bar">${bars}</div>
        <div class="style-legend">${legend}</div>
      </div>
    `;
  }

  function openDrawer(idx) {
    const spu = DATA.spus[idx];
    document.getElementById('drawer-spu').textContent = `#${spu.rank}  ${spu.spu}`;
    document.getElementById('drawer-meta').textContent =
      `${spu.productCount}个商品 · ${spu.shopCount}家店铺 · 合计GMV≈${fmtWan(spu.totalGmv)} · 单价 ${spu.priceRange}`;

    const list = document.getElementById('shop-list');
    list.innerHTML = spu.shops.map(s => `
      <div class="shop-item ${s.isNew ? 'new-cust' : ''}">
        <div class="shop-rank">${s.rank}</div>
        <div class="shop-img"><img src="${s.topProductImg}" alt="" onerror="this.style.display='none'"></div>
        <div class="shop-info">
          <div class="shop-name">
            ${s.shop}
            <span class="shop-tag ${s.isNew ? 'new' : 'invested'}">${s.isNew ? '🔥 潜在新客' : '✓ 已投ADQ'}</span>
          </div>
          <div class="shop-product">${s.topProduct}</div>
          <div class="shop-stats">
            <span>该SPU下 <b>${s.productCount}</b> 商品</span>
            <span>店铺GMV≈<b>${fmtWan(s.gmvEst)}</b></span>
            <span>TOP商品：<b>${s.topGmvBucket}</b></span>
          </div>
          ${s.isNew
            ? `<div class="adq-info"><b>ADQ未投放</b> · 品牌词：${s.brand || '-'}</div>`
            : `<div class="adq-info"><b>已投ADQ客户：</b>${s.adqCust}</div>`}
        </div>
      </div>
    `).join('');

    document.getElementById('drawer-mask').classList.add('open');
    document.getElementById('drawer').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    document.getElementById('drawer-mask').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('drawer-close').onclick = closeDrawer;
  document.getElementById('drawer-mask').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  // 加载数据
  fetch('spu_dashboard_data.json')
    .then(r => r.json())
    .then(data => { DATA = data; renderKPI(); renderSPU(); })
    .catch(err => {
      document.getElementById('spu-grid').innerHTML =
        '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#e74c3c;">' +
        '❌ 加载数据失败，请通过HTTP服务打开（不能直接双击HTML）：<br>' +
        '<code style="background:#f0f0f0;padding:6px 10px;border-radius:4px;margin-top:8px;display:inline-block;">' +
        'cd 目录 && python3 -m http.server 8899</code></div>';
    });
</script>

</body>
</html>
