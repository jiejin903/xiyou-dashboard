<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
       background: #f5f7fa; color: #2c3e50; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }

.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white; padding: 28px 24px; border-radius: 14px; margin-bottom: 18px;
          box-shadow: 0 4px 18px rgba(102,126,234,0.3); }
.header h1 { font-size: 22px; margin-bottom: 6px; }
.header p { opacity: 0.9; font-size: 13px; }
.header .tag { display:inline-block; background:rgba(255,255,255,0.2); padding:2px 10px;
               border-radius:12px; font-size:11px; margin-right:6px; }

.summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
.scard { background: white; border-radius: 10px; padding: 16px 14px;
         box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #667eea;
         text-align: center; }
.scard .label { font-size: 12px; color: #909399; margin-bottom: 6px; }
.scard .value { font-size: 22px; font-weight: 700; color: #303133; }
.scard.big { border-color: #f56c6c; }
.scard.big .value { color: #f56c6c; }

/* 主Tab: 店铺榜 / 爆品榜 */
.main-tabs { display: flex; gap: 6px; background: white; padding: 6px;
             border-radius: 10px; margin-bottom: 14px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.m-tab { flex: 1; padding: 12px 18px; cursor: pointer; border-radius: 8px;
         font-size: 14px; font-weight: 600; color: #606266;
         text-align: center; transition: all .2s; }
.m-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }

/* 子Tab: 5个类目 */
.sub-tabs { display: flex; gap: 6px; background: white; padding: 6px;
            border-radius: 10px; margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow-x: auto; flex-wrap: nowrap; }
.s-tab { padding: 8px 16px; cursor: pointer; border-radius: 6px;
         font-size: 13px; font-weight: 500; color: #606266;
         white-space: nowrap; transition: all .2s; }
.s-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.s-tab .count { display:inline-block; background:rgba(0,0,0,0.06); padding:1px 8px;
                border-radius:10px; margin-left:6px; font-size:11px; }
.s-tab.active .count { background: rgba(255,255,255,0.3); }

.section-title { font-size: 15px; font-weight: 700; margin: 20px 0 12px;
                 padding-left: 10px; border-left: 4px solid #667eea; }

/* 店铺卡片 (v1样式保留) */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
             gap: 12px; }
.shop-card { background: white; border-radius: 12px; padding: 16px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.05);
             transition: transform .2s; position: relative; overflow: hidden; }
.shop-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(102,126,234,0.15); }
.shop-card .rank { position: absolute; top: 12px; right: 12px;
                   background: linear-gradient(135deg, #667eea, #764ba2);
                   color: white; padding: 3px 10px; border-radius: 12px;
                   font-size: 11px; font-weight: 600; }
.shop-card .rank.top { background: linear-gradient(135deg, #ff9500, #ff5e3a); }
.shop-name { font-size: 15px; font-weight: 700; color: #303133;
             margin-bottom: 4px; padding-right: 60px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-brand { font-size: 11px; color: #909399; margin-bottom: 10px; }
.shop-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tag-badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
             font-size: 11px; }
.tag-type { background: #ecf5ff; color: #409eff; }
.tag-brand { background: #fdf6ec; color: #e6a23c; }
.tag-flag { background: #f0f9eb; color: #67c23a; }
.tag-cate { background: #f4f4f5; color: #606266; }
.shop-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px;
              padding: 10px 12px; background: #fafbfc; border-radius: 8px;
              margin-bottom: 10px; }
.stat { display: flex; flex-direction: column; }
.stat-lbl { font-size: 10.5px; color: #909399; }
.stat-val { font-size: 13px; font-weight: 700; color: #f56c6c; margin-top: 1px; }
.stat-val.blue { color: #409eff; }
.btn { display: block; padding: 8px; text-align: center; border-radius: 6px;
       font-size: 12px; color: #606266; background: #f5f7fa;
       cursor: pointer; text-decoration: none; transition: all .2s; }
.btn:hover { background: #667eea; color: white; }

/* 商品卡片 (v2新增) - 参考珠宝页 */
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
             gap: 14px; }
.prod-card { background: white; border-radius: 12px; padding: 14px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.05);
             transition: transform .2s; position: relative; }
.prod-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(102,126,234,0.15); }
.prod-rank { position: absolute; top: 8px; left: 8px; z-index: 2;
             background: linear-gradient(135deg, #667eea, #764ba2);
             color: white; padding: 3px 10px; border-radius: 10px;
             font-size: 12px; font-weight: 700; }
.prod-rank.top3 { background: linear-gradient(135deg, #ff9500, #ff5e3a); }
.prod-img-wrap { position: relative; width: 100%; padding-top: 100%;
                 background: #f5f7fa; border-radius: 8px; overflow: hidden;
                 margin-bottom: 10px; }
.prod-img { position: absolute; top:0; left:0; width: 100%; height: 100%;
            object-fit: cover; }
.prod-title { font-size: 13px; color: #303133; line-height: 1.4;
              margin-bottom: 8px; height: 36px; overflow: hidden;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.prod-shop { font-size: 11px; color: #909399; margin-bottom: 6px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.prod-new { background: #f0f9eb; color: #67c23a; padding: 2px 8px;
            border-radius: 4px; font-size: 11px; font-weight: 600; }
.prod-invested { background: #fef0f0; color: #f56c6c; padding: 2px 8px;
                 border-radius: 4px; font-size: 11px; }
.prod-cate { background: #f4f4f5; color: #606266; padding: 2px 8px;
             border-radius: 4px; font-size: 11px; }
.prod-links { display: flex; gap: 6px; margin-top: 6px; }
.prod-links a { flex:1; padding: 6px; font-size: 11px; text-align: center;
                border-radius: 4px; background: #f5f7fa; color: #606266;
                text-decoration: none; transition: all .2s; }
.prod-links a:hover { background: #667eea; color: white; }

.empty { text-align: center; padding: 40px; color: #909399; font-size: 13px; }

.panel { display: none; }
.panel.active { display: block; }

@media (max-width: 768px) {
  .container { padding: 12px; }
  .header h1 { font-size: 17px; }
  .summary { grid-template-columns: repeat(3, 1fr); }
  .scard { padding: 10px; } .scard .value { font-size: 16px; }
  .shop-grid, .prod-grid { grid-template-columns: 1fr; }
  .m-tab { padding: 10px 12px; font-size: 13px; }
  .s-tab { padding: 6px 12px; font-size: 12px; }
}
@media (max-width: 480px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .prod-grid { grid-template-columns: repeat(2, 1fr); }
  .prod-card { padding: 8px; }
  .prod-title { font-size: 11px; height: 30px; }
}
</style>

ef718cae3321ba3db", "shopName": "", "shopUrl": "https://dy.feigua.cn/app/#/shop-detail/index?shopId=lOlgsKKF&ts=1782894604&sign=8171b040f556aa1889662c3a6dc31a80", "rowText": "", "赛道": "鞋靴", "shop_id": "lOlgsKKF", "店铺名": "Rockfish官方旗舰店", "是否已投ADQ": "潜在新客", "匹配ADQ客户": ""}]};
const CATE_ORDER = ["贴身衣物", "男装", "童装", "箱包", "鞋靴"];

let currentView = 'shop';
let currentCate = CATE_ORDER[0];

function fmt(v){ return (v===null||v===undefined||v==='') ? '-' : v; }

function renderSubTabs() {
  const el = document.getElementById('sub-tabs');
  el.innerHTML = CATE_ORDER.map(c => {
    const cnt = currentView==='shop' ? (shopBuckets[c]||[]).length 
                                     : (prodBuckets[c]||[]).length;
    return `<div class="s-tab ${c===currentCate?'active':''}" data-cate="${c}">
              ${c} <span class="count">${cnt}</span></div>`;
  }).join('');
  el.querySelectorAll('.s-tab').forEach(t => {
    t.addEventListener('click', () => {
      currentCate = t.dataset.cate;
      renderSubTabs();
      renderContent();
    });
  });
}

function renderContent() {
  if (currentView === 'shop') {
    document.getElementById('panel-shop').classList.add('active');
    document.getElementById('panel-prod').classList.remove('active');
    renderShops();
  } else {
    document.getElementById('panel-prod').classList.add('active');
    document.getElementById('panel-shop').classList.remove('active');
    renderProds();
  }
}

function renderShops() {
  const list = shopBuckets[currentCate] || [];
  const el = document.getElementById('shop-content');
  if (!list.length) { el.innerHTML='<div class="empty">该赛道暂无潜在新客店铺</div>'; return; }
  el.innerHTML = `<div class="section-title">🏆 ${currentCate} · 潜在新客店铺 TOP${list.length}</div>
    <div class="shop-grid">${list.map(s => {
      const rankCls = s['排名']<=10?'rank top':'rank';
      const tags = [];
      if (s['店铺类型']) tags.push(`<span class="tag-badge tag-type">${s['店铺类型']}</span>`);
      if (s['是否品牌']==true||s['是否品牌']=='True') tags.push(`<span class="tag-badge tag-brand">品牌店</span>`);
      if (s['是否旗舰店']==true||s['是否旗舰店']=='True') tags.push(`<span class="tag-badge tag-flag">旗舰店</span>`);
      return `<div class="shop-card">
        <div class="${rankCls}">#${s['排名']}</div>
        <div class="shop-name" title="${s['店铺名']}">${s['店铺名']}</div>
        <div class="shop-brand">品牌: <b>${s['提取品牌词']||'-'}</b> · 体验分 ${fmt(s['体验分'])}</div>
        <div class="shop-tags">${tags.join('')}</div>
        <div class="shop-stats">
          <div class="stat"><span class="stat-lbl">周GMV</span><span class="stat-val">${fmt(s['总GMV档'])}</span></div>
          <div class="stat"><span class="stat-lbl">周销量</span><span class="stat-val blue">${fmt(s['销量档'])}</span></div>
          <div class="stat"><span class="stat-lbl">直播GMV</span><span class="stat-val">${fmt(s['直播GMV档'])}</span></div>
          <div class="stat"><span class="stat-lbl">视频GMV</span><span class="stat-val">${fmt(s['视频GMV档'])}</span></div>
        </div>
        <a class="btn" href="${s['店铺链接']||'#'}" target="_blank">🛒 抖音小店</a>
      </div>`;
    }).join('')}</div>`;
}

function renderProds() {
  const list = prodBuckets[currentCate] || [];
  const el = document.getElementById('prod-content');
  if (!list.length) { el.innerHTML='<div class="empty">该赛道暂无爆品数据</div>'; return; }
  el.innerHTML = `<div class="section-title">🔥 ${currentCate} · 近期爆品 TOP${list.length}</div>
    <div class="prod-grid">${list.map(p => {
      const rankCls = p['rank']<=3?'prod-rank top3':'prod-rank';
      const status = p['是否已投ADQ']||'未知';
      const badge = status==='潜在新客' ? '<span class="prod-new">🌱 潜在新客</span>' :
                    status==='已投' ? `<span class="prod-invested">✔ 已投ADQ</span>` : '';
      return `<div class="prod-card">
        <div class="${rankCls}">#${p['rank']}</div>
        <div class="prod-img-wrap">
          ${p['image']?`<img class="prod-img" src="${p['image']}" alt="${p['title']}" loading="lazy">`:''}
        </div>
        <div class="prod-title" title="${p['title']}">${p['title']}</div>
        <div class="prod-shop">🏬 ${p['店铺名']||'-'}</div>
        <div class="prod-badges">
          <span class="prod-cate">${p['赛道']}</span>
          ${badge}
        </div>
        <div class="prod-links">
          <a href="${p['goodsUrl']||'#'}" target="_blank">飞瓜详情</a>
          <a href="${p['shopUrl']||'#'}" target="_blank">店铺</a>
        </div>
      </div>`;
    }).join('')}</div>`;
}

// 主Tab切换
document.querySelectorAll('.m-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentView = t.dataset.view;
    renderSubTabs();
    renderContent();
  });
});

renderSubTabs();
renderContent();
</script>
