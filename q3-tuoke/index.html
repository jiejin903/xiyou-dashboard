<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;

.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

          box-shadow: 0 4px 18px rgba(102,126,234,0.3); }
.header h1 { font-size: 22px; margin-bottom: 6px; }
.header p { opacity: 0.9; font-size: 13px; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.scard { background: white; border-radius: 10px; padding: 16px 18px;
         box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #667eea; }
.scard .label { font-size: 12px; color: #909399; margin-bottom: 4px; }
.scard .value { font-size: 22px; font-weight: 700; color: #303133; }

.section-title { font-size: 17px; font-weight: 700; margin: 20px 0 12px;
                 padding-left: 10px; border-left: 4px solid #667eea; }

/* ===== 赛道大盘 - 饼图 + 一句话总结 ===== */
.overview { background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: stretch; }
.pie-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pie-svg { width: 280px; height: 280px; }
.pie-center { text-align: center; margin-top: 12px; font-size: 12px; color: #909399; }
.pie-center b { font-size: 18px; color: #303133; display: block; }
.summary-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 6px; }
.sum-item { display: grid; grid-template-columns: 14px 110px 70px 1fr;
            gap: 10px; align-items: center; padding: 8px 10px;
            border-radius: 8px; background: #fafbfc; transition: all .2s; }
.sum-item:hover { background: #f0f4ff; transform: translateX(2px); }
.sum-dot { width: 10px; height: 10px; border-radius: 50%; }
.sum-name { font-size: 13px; font-weight: 700; color: #303133; }
.sum-amt { font-size: 12px; font-weight: 600; color: #f56c6c; text-align: right; }
.sum-desc { font-size: 11.5px; color: #606266; line-height: 1.45; }

/* ===== 赛道Tab栏 ===== */
.track-tabs { display: flex; gap: 6px; background: white; padding: 6px;
              border-radius: 10px; margin-bottom: 14px;
              box-shadow: 0 2px 8px rgba(0,0,0,0.04);
              overflow-x: auto; flex-wrap: nowrap; }
.t-tab { padding: 8px 16px; cursor: pointer; border-radius: 6px;
         font-size: 13px; font-weight: 500; color: #606266;
         white-space: nowrap; transition: all .2s; }
.t-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.t-tab:hover:not(.active) { background: #f0f2f5; }

/* ===== 赛道卡片(爆品+产业带) ===== */
.track-card { background: white; border-radius: 14px; padding: 0;
              margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
.track-head { background: linear-gradient(135deg, #f6f9ff, #f0f4ff);
              padding: 16px 22px; border-bottom: 1px solid #e8eaf0;
              display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.track-head .name { font-size: 17px; font-weight: 700; color: #303133; }
.track-head .stat { font-size: 12px; color: #606266; padding: 3px 10px;
                    background: white; border-radius: 12px; }
.track-head .stat b { color: #667eea; }
.track-body { padding: 18px 22px; }

.sub-h { font-size: 13px; font-weight: 600; color: #606266;
         margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.sub-h::before { content: ''; width: 3px; height: 14px; background: #667eea; border-radius: 2px; }

/* ===== 爆品TOP表格 ===== */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { background: #fafbfc; padding: 8px 10px; text-align: left;
     font-weight: 600; color: #606266; border-bottom: 2px solid #e4e7ed; white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid #f0f2f5; color: #303133; vertical-align: top; }
tr:hover { background: #f9fafc; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.num.big { color: #f56c6c; font-weight: 700; }
.roi-good { color: #67c23a; font-weight: 600; }
.roi-bad { color: #f56c6c; font-weight: 600; }
.kw { display: inline-block; padding: 1px 7px; background: #f0f9eb; color: #67c23a;
      border-radius: 4px; font-size: 11px; margin: 1px 3px 1px 0; }

.expand-row { text-align: center; padding: 8px; color: #667eea;
              font-size: 12px; cursor: pointer; background: #f9fafc;
              border-top: 1px dashed #dcdfe6; transition: background .2s; }
.expand-row:hover { background: #ecf0f3; }

/* ===== 产业带网格 ===== */
.belt-grid { display: grid; grid-template-columns: repeat(4, 1fr);
             gap: 10px; margin-top: 8px; }
.belt-card { background: #fafbfc; border: 1px solid #ecf0f3; border-radius: 8px;
             padding: 12px 14px; transition: transform .2s, box-shadow .2s; }
.belt-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.1); }
.belt-loc { font-size: 14px; font-weight: 700; color: #303133; margin-bottom: 4px; }
.belt-loc .prov { font-size: 11px; color: #909399; font-weight: 400; margin-left: 4px; }
.belt-stats { font-size: 11px; color: #606266; margin-bottom: 8px; }
.belt-stats b { color: #f56c6c; }
.belt-cat-tag { font-size: 11px; color: #909399; margin-bottom: 6px;
                line-height: 1.4; }
.belt-bench { background: white; border-radius: 6px; padding: 6px 10px;
              font-size: 12px; border-left: 3px solid #e6a23c; }
.belt-bench .lbl { font-size: 10px; color: #909399; margin-bottom: 2px; }
.belt-bench .name { font-weight: 600; color: #303133; }
.belt-bench .v { font-size: 11px; color: #606266; margin-top: 2px; }

.belt-more { text-align: center; padding: 8px; margin-top: 8px;
             color: #667eea; font-size: 12px; cursor: pointer; }

@media (max-width: 768px) {
  .container { padding: 12px; }

  .header p { font-size: 11px; }

  .overview { grid-template-columns: 1fr; padding: 14px; gap: 16px; }

  .sum-name { font-size: 12px; }

  .sum-desc { font-size: 10.5px; }
  .track-head { padding: 12px 14px; gap: 8px; }
  .track-head .name { font-size: 15px; }
  .track-head .stat { font-size: 11px; padding: 2px 7px; }
  .track-body { padding: 12px 14px; }
  th, td { padding: 6px 6px; font-size: 11px; }
  .hide-mobile { display: none; }
  .belt-grid { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 480px) {
  th, td { padding: 5px 5px; font-size: 10.5px; }
  .belt-grid { grid-template-columns: 1fr; }

function fmt(n, d=0) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '-';
  const v = Number(n);
  if (Math.abs(v) >= 10000) return (v/10000).toFixed(2) + '万';
  return v.toFixed(d);
}
function pct(n) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return Number(n).toFixed(1) + '%';
}
function roiCls(v) { if (!v||isNaN(v)) return ''; return v>=3?'roi-good':(v<2?'roi-bad':''); }

// === 1. 赛道大盘 - 饼图 + 一句话总结 ===
const PIE_COLORS = ['#667eea','#764ba2','#f56c6c','#67c23a','#e6a23c','#409eff',
                    '#9b59b6','#16a085','#e74c3c','#3498db','#f39c12','#1abc9c',
                    '#8e44ad','#c0392b','#d35400','#7f8c8d'];

function renderOverview() {
  const data = buckets.filter(b=>b['日均消耗']>0)
                       .sort((a,b)=>b['日均消耗']-a['日均消耗']);
  const total = data.reduce((s,b)=>s+b['日均消耗'], 0);

  // 饼图：SVG donut, cx=cy=50, r=40, 内圈r=24
  let cumAngle = -90;  // 从12点位置开始
  const cx=50, cy=50, r=40, rInner=24;
  let segs = '';
  data.forEach((b, i) => {
    const ratio = b['日均消耗']/total;
    const angle = ratio * 360;
    // 占比<0.5%的赛道不画扇区(避免视觉噪点),后面用文字汇总
    if (ratio < 0.005) return;
    const a1 = cumAngle * Math.PI/180;
    const a2 = (cumAngle+angle) * Math.PI/180;
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
    const x3 = cx + rInner*Math.cos(a2), y3 = cy + rInner*Math.sin(a2);
    const x4 = cx + rInner*Math.cos(a1), y4 = cy + rInner*Math.sin(a1);
    const large = angle > 180 ? 1 : 0;
    const color = PIE_COLORS[i % PIE_COLORS.length];
    segs += `<path d="M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2}
                       L${x3},${y3} A${rInner},${rInner} 0 ${large},0 ${x4},${y4} Z"
                       fill="${color}" stroke="white" stroke-width="0.5"
                       data-idx="${i}" style="cursor:pointer;transition:opacity .2s"
                       onmouseover="this.style.opacity=0.75"
                       onmouseout="this.style.opacity=1"/>`;
    cumAngle += angle;
  });
  document.getElementById('pie-svg').innerHTML = segs;

  // 一句话总结列表
  const html = data.map((b, i)=>{
    const color = PIE_COLORS[i % PIE_COLORS.length];
    return `<div class="sum-item">
      <div class="sum-dot" style="background:${color}"></div>
      <div class="sum-name">${b['赛道']}</div>
      <div class="sum-amt">${fmt(b['日均消耗'])} <span style="color:#909399;font-weight:400;font-size:10px;">${pct(b['消耗占比'])}</span></div>
      <div class="sum-desc">${b['一句话总结']||'-'}</div>
    </div>`;
  }).join('');
  document.getElementById('summary-list').innerHTML = html;
}

// === 赛道Tab栏 ===
function renderTabs() {
  const data = buckets.filter(b=>b['日均消耗']>0);
  const tabs = ['<div class="t-tab active" data-track="">📊 整体</div>'];
  data.forEach(b=>{
    tabs.push(`<div class="t-tab" data-track="${b['赛道']}">${b['赛道']}</div>`);
  });
  document.getElementById('track-tabs').innerHTML = tabs.join('');
  document.querySelectorAll('.t-tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.t-tab').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      renderTracks(el.dataset.track || '');
    });
  });
}

// === 2. 各赛道卡片 ===
const TOP_CAT = 5;     // 默认显示爆品数
const TOP_BELT = 8;    // 产业带：>8才折叠，默认显示前8个(刚好2行)

function renderTracks(filterTrack) {
  filterTrack = filterTrack || '';
  const html = buckets.map((b, idx) => {
    if (b['日均消耗'] <= 0) return '';
    if (filterTrack && b['赛道'] !== filterTrack) return '';
    const cats = b['爆品'] || [];
    const belts = b['产业带'] || [];

    // 爆品表
    let catTable = '';
    if (cats.length === 0) {
      catTable = '<div style="color:#909399;font-size:12px;padding:8px;">该赛道暂无日耗≥1万的爆品类目</div>';
    } else {
      const renderRow = (c) => `<tr>
        <td><b>${c['三级类目']}</b></td>
        <td class="num big">${fmt(c['日均消耗(元)'])}</td>
        <td class="num">${c['在投客户数']}</td>
        <td class="num">${fmt(c['主流客单价(元)'],1)}</td>
        <td class="num ${roiCls(c['主流ROI'])}">${fmt(c['主流ROI'],2)}</td>
        <td>${(c['5个关键词']||'').split(' | ').filter(Boolean).map(k=>`<span class="kw">${k}</span>`).join('')}</td>
      </tr>`;
      const shown = cats.slice(0, TOP_CAT).map(renderRow).join('');
      const hidden = cats.slice(TOP_CAT).map(renderRow).join('');
      catTable = `<table>
        <thead><tr>
          <th>三级类目</th><th class="num">日均消耗</th><th class="num">客户数</th>
          <th class="num">客单价</th><th class="num">ROI</th><th>爆品特征</th>
        </tr></thead>
        <tbody>${shown}
          ${hidden ? `<tbody id="cat-extra-${idx}" style="display:none">${hidden}</tbody>` : ''}
        </tbody>
      </table>`;
      if (hidden) {
        catTable += `<div class="expand-row" onclick="toggleCat(${idx}, this)">
          展开剩余 ${cats.length - TOP_CAT} 个爆品 ▼</div>`;
      }
    }

    // 产业带网格
    let beltHtml = '';
    if (belts.length === 0) {
      beltHtml = '<div style="color:#909399;font-size:12px;padding:8px;">该赛道暂无产业带数据</div>';
    } else {
      const renderBelt = (bl) => `<div class="belt-card">
        <div class="belt-loc">${bl['市']} <span class="prov">${bl['省']}</span></div>
        <div class="belt-stats">客户 <b>${bl['客户数']}</b> 家 · 日耗 <b>${fmt(bl['日均消耗'])}</b></div>
        <div class="belt-cat-tag">主营：${bl['主营品类'] || '-'}</div>
        <div class="belt-bench">
          <div class="lbl">🏆 标杆客户</div>
          <div class="name">${bl['标杆客户'] || '-'}</div>
          <div class="v">日耗 ${fmt(bl['标杆客户日耗'])}</div>
        </div>
      </div>`;
      const shown = belts.slice(0, TOP_BELT).map(renderBelt).join('');
      const hidden = belts.slice(TOP_BELT).map(renderBelt).join('');
      beltHtml = `<div class="belt-grid">${shown}</div>`;
      if (hidden) {
        beltHtml += `<div class="belt-grid" id="belt-extra-${idx}" style="display:none;margin-top:10px;">${hidden}</div>`;
        beltHtml += `<div class="belt-more" onclick="toggleBelt(${idx}, this)">
          展开剩余 ${belts.length - TOP_BELT} 个产业带 ▼</div>`;
      }
    }

    return `<div class="track-card">
      <div class="track-head">
        <div class="name">${b['赛道']}</div>
        <div class="stat">日耗 <b>${fmt(b['日均消耗'])}</b></div>
        <div class="stat">占比 <b>${pct(b['消耗占比'])}</b></div>
        <div class="stat">客户 <b>${b['客户数']}</b> 家</div>
        <div class="stat">客单 <b>${fmt(b['主流客单价'],1)}</b></div>
        <div class="stat">ROI <b class="${roiCls(b['主流ROI'])}">${fmt(b['主流ROI'],2)}</b></div>
      </div>
      <div class="track-body">
        <div class="sub-h">🔥 爆品TOP（默认显示前${TOP_CAT}个）</div>
        ${catTable}
        <div class="sub-h" style="margin-top:18px;">🗺️ 产业带分布（默认显示前${TOP_BELT}个城市）</div>
        ${beltHtml}
      </div>
    </div>`;
  }).join('');
  document.getElementById('tracks').innerHTML = html;
}

function toggleCat(idx, el) {
  const ex = document.getElementById('cat-extra-'+idx);
  if (!ex) return;
  const open = ex.style.display !== 'none';
  ex.style.display = open ? 'none' : '';
  const m = el.textContent.match(/\d+/);
  el.textContent = open
    ? `展开剩余 ${m ? m[0] : ''} 个爆品 ▼`
    : `收起 ▲`;
}
function toggleBelt(idx, el) {
  const ex = document.getElementById('belt-extra-'+idx);
  if (!ex) return;
  const open = ex.style.display !== 'none';
  ex.style.display = open ? 'none' : '';
  const m = el.textContent.match(/\d+/);
  el.textContent = open
    ? `展开剩余 ${m ? m[0] : ''} 个产业带 ▼`
    : `收起 ▲`;
}

renderOverview();
renderTabs();
renderTracks();
</script>
</body>
</html>
